<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

<title>AION 2 · Market Ledger</title>

<meta property="og:title" content="AION 2 · Market Ledger">
<meta property="og:description" content="Stock, market prices, crafting and listings for Aion 2 · Stock, prix, crafts et HDV.">

<meta name="theme-color" content="#0b1417">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#0b1417; --panel:#121f25; --panel-2:#17282f; --line:#243c44; --fg:#e6eeee; --muted:#8ea4a8; --metal:#c8a76c; --teal:#41c4c0;
  --r-h:#f07a1a; --r-u:#e8b923; --r-e:#3f8fe6; --r-r:#3bb55a; --r-g:#c3cccd;
  --ok:#3bb55a; --mid:#e8b923; --no:#e05a4f; --buy:#41c4c0;
  --f-display:"Cinzel", "Trajan Pro", Georgia, serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;padding:20px 16px 48px;
  background-image:radial-gradient(ellipse 1000px 460px at 50% -140px,#1c3940 0%,transparent 70%);background-repeat:no-repeat}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2{font-family:var(--f-display);font-weight:700;letter-spacing:.02em;margin:0;text-wrap:balance}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px}
header h1{font-size:clamp(24px,4vw,34px)}header h1 span{color:var(--metal)}
header p{margin:2px 0 0;color:var(--muted)}
.hright{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:transparent;border:0;color:var(--muted);font:700 12px var(--f-body);padding:5px 11px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--metal);color:#1a1408}
:focus-visible{outline:2px solid var(--metal);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.k-h{color:var(--r-h)}.k-u{color:var(--r-u)}.k-e{color:var(--r-e)}.k-r{color:var(--r-r)}.k-g{color:var(--r-g)}

.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.tile .lab{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile .val{font:600 22px var(--f-mono);font-variant-numeric:tabular-nums;margin-top:4px;overflow:hidden;text-overflow:ellipsis}
.tile .sub{font-size:12.5px;color:var(--muted)}
.tile input.val{width:100%;background:transparent;border:0;border-bottom:1px dashed var(--line);color:inherit;padding:0;outline:none}
.tile input.val:focus{border-bottom-color:var(--metal)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.ph{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.ph h2{font-size:18px}
.lede{color:var(--muted);font-size:13.5px;margin:0}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{background:var(--bg);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:5px 12px;font:600 13px var(--f-body);cursor:pointer}
.tabs button[aria-pressed="true"]{color:#1a1408;background:var(--metal);border-color:var(--metal)}
.tools{position:relative;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
input.search{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 11px;font:14px var(--f-body);width:min(420px,100%)}
.sugg{position:absolute;top:100%;left:0;z-index:40;width:min(420px,100%);margin-top:4px;background:#0e1a1e;border:1px solid var(--metal);border-radius:10px;padding:6px;display:none;max-height:320px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.sugg button{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:0;color:var(--fg);text-align:left;padding:6px 8px;border-radius:6px;font:600 14px var(--f-body);cursor:pointer}
.sugg button:hover,.sugg button:focus{background:var(--panel-2)}
.sugg button em{margin-left:auto;font-style:normal;color:var(--metal);font-size:12.5px;white-space:nowrap}
.sugg p{margin:4px 8px;color:var(--muted);font-size:12.5px}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right}
td.num{position:relative}
td.name{white-space:normal;min-width:200px;font-weight:600}
td.name small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.cell{background:transparent;border:1px solid transparent;border-radius:6px;color:var(--fg);font:500 14px var(--f-mono);text-align:right;width:100px;padding:4px 6px}
.cell.q{width:72px}
.cell:hover{border-color:var(--line)}
.cell:focus{border-color:var(--metal);background:var(--bg);outline:none}
.cell.dirty{border-color:var(--mid)!important;background:var(--bg)}
.cell::placeholder{color:#55707a}
.okc{position:absolute;right:-6px;top:50%;transform:translateY(-50%);z-index:3;background:var(--ok);color:#06210f;border:0;border-radius:6px;width:24px;height:24px;font:700 13px var(--f-body);cursor:pointer}
.sig{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font:700 12px var(--f-body);border:1px solid currentColor}
.sig i{width:7px;height:7px;border-radius:50%;background:currentColor}
.s-sell{color:var(--ok)}.s-buy{color:var(--buy)}.s-wait{color:var(--mid)}.s-high{color:var(--no)}.s-na,.s-bound,.s-track{color:var(--muted)}.s-keep{color:var(--r-e)}
.ressum{margin:0 0 10px;font-size:13.5px;color:var(--muted)}.ressum b{color:var(--fg);font-family:var(--f-mono)}
.diff{font:500 12px var(--f-mono)}
.up{color:var(--ok)}.down{color:var(--no)}
svg.spark{width:84px;height:24px;display:block}
td.hs{cursor:pointer}td.hs:hover .spark{opacity:.75}
.grip{cursor:grab;touch-action:none;user-select:none;color:var(--muted);display:inline-flex;flex-direction:column;gap:3px;padding:6px 4px}
.grip i{display:block;width:16px;height:2px;border-radius:1px;background:currentColor}
.grip:hover{color:var(--fg)}
td.g{width:28px;padding-right:0}
tr.drag{background:var(--panel-2);outline:1px solid var(--metal)}tr.drag .grip{cursor:grabbing;color:var(--metal)}
.rm{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:6px;min-width:26px;height:26px;cursor:pointer;font:600 12px var(--f-body);padding:0 6px}
.rm:hover{color:var(--no);border-color:var(--no)}
.rm.arm{color:var(--no);border-color:var(--no)}
.empty-state{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}

.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:1000px){.two{grid-template-columns:1fr}}
.recipes{display:flex;flex-direction:column;gap:12px}
.rc{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:12px 14px}
.rc h3{margin:0;font:700 15px var(--f-body);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.rc h3 .nm{display:inline-flex;align-items:center}
.rc .ing{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.rc .ing span{font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--muted)}
.rc .ing span b{color:var(--fg);font-weight:600}
.rc .ing span.miss{border-color:var(--no);color:var(--no)}
.rc .nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:520px){.rc .nums{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rc .nums div{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.rc .nums b{display:block;font:600 15px var(--f-mono);color:var(--fg);text-transform:none;letter-spacing:0}
.gain-ok{color:var(--ok)!important}.gain-no{color:var(--no)!important}
.rc .foot{margin-top:8px;font-size:13px;color:var(--muted)}
.mk{display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap}
.mk input{background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--fg);font:500 13px var(--f-mono);width:80px;padding:5px 7px}
.mk span{font-size:12.5px;color:var(--muted)}

.slots{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.slot{display:grid;grid-template-columns:22px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line)}
.slot .n{font:500 12px var(--f-mono);color:var(--muted)}
.slot .it{min-width:0;font-weight:600}
.slot .it small{display:block;color:var(--muted);font:500 12px var(--f-mono)}
.slot .net{font:600 14px var(--f-mono);text-align:right}
.slot.empty .it{color:var(--muted);font-weight:400;font-style:italic}
.exp{color:var(--no);font-weight:700}
.btn{background:var(--metal);color:#1a1408;border:0;border-radius:8px;padding:6px 12px;font:700 13px var(--f-body);cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.ghost:hover{color:var(--fg)}
.btn.ok{background:var(--ok);color:#06210f}
.btns{display:flex;gap:6px}
.add{display:grid;grid-template-columns:minmax(0,1fr) 84px 120px auto;gap:8px;margin-top:12px}
@media (max-width:560px){.add{grid-template-columns:1fr 1fr}}
.add select,.add input{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 8px;font:14px var(--f-body);min-width:0}
.add input{font-family:var(--f-mono)}
.sub-h{font:700 13px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 0}
.next{margin-top:16px}
.next h3{font:700 13px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 6px}
.next ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.next li span{color:var(--muted);font-family:var(--f-mono);font-size:12.5px}
#ops li{font-size:13.5px}#ops .pos{color:var(--ok)}#ops .neg{color:var(--no)}
.toast{min-height:1.2em;font-size:13px;color:var(--ok);margin-top:8px}

.ico{width:30px;height:30px;flex:none;border-radius:6px;display:inline-block;vertical-align:middle}
td.name .ico{float:left;margin:2px 10px 0 0}
.slot .it .ico,.rc h3 .ico{width:26px;height:26px;margin-right:8px}
.slot .it .ico{float:left;margin-top:2px}
.sugg .ico{width:24px;height:24px}

#tip{position:fixed;z-index:50;max-width:320px;background:#0e1a1e;border:1px solid var(--metal);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.45;color:var(--fg);box-shadow:0 8px 24px rgba(0,0,0,.5);pointer-events:none;display:none}
#tip b.t{display:block;font-size:14px;margin-bottom:4px}
#tip .eff{color:#7ee08a}
#tip .lbl{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;display:block;margin-top:6px}
[data-tip]{cursor:help}
#hist{position:fixed;z-index:60;width:280px;background:#0e1a1e;border:1px solid var(--metal);border-radius:10px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.5);display:none}
#hist h4{margin:0 0 6px;font:700 14px var(--f-body);display:flex;justify-content:space-between;align-items:center;gap:8px}
#hist ul{list-style:none;margin:0;padding:0;max-height:260px;overflow:auto}
#hist li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--line);font:500 13px var(--f-mono)}
#hist li span{color:var(--muted)}
#hist button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:6px;width:24px;height:24px;cursor:pointer}
#hist button:hover{color:var(--no);border-color:var(--no)}

.backup{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.backup textarea{flex:1 1 320px;min-height:44px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:12px var(--f-mono);resize:vertical}
footer{color:var(--muted);font-size:12.5px;text-align:center;display:flex;flex-direction:column;gap:6px}
footer nav{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
footer a{color:var(--metal);text-decoration:none}footer a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>AION 2 · <span>Market Ledger</span></h1>
      <p data-i="sub"></p>
    </div>
    <div class="hright">
      <div class="lang" role="group" aria-label="Langue / Language"><button type="button" data-lang="fr">FR</button><button type="button" data-lang="en">EN</button></div>
    </div>
  </header>

  <section class="tiles" aria-label="Summary">
    <div class="tile"><div class="lab" data-i="tKin"></div><input class="val" id="tKin" inputmode="numeric" placeholder="—"><div class="sub" id="tKinSub"></div></div>
    <div class="tile"><div class="lab" data-i="tStock"></div><div class="val" id="tStock">—</div><div class="sub" data-i="afterTax"></div></div>
    <div class="tile"><div class="lab" data-i="tHdv"></div><div class="val" id="tHdv">—</div><div class="sub" id="tHdvSub"></div></div>
    <div class="tile"><div class="lab" data-i="tDay"></div><div class="val" id="tDay">—</div><div class="sub" id="tDaySub"></div></div>
    <div class="tile"><div class="lab" data-i="tCraft"></div><div class="val" id="tCraft">—</div><div class="sub" id="tCraftSub"></div></div>
  </section>

  <section class="panel" aria-labelledby="stockH">
    <div class="ph">
      <div><h2 id="stockH" data-i="stockH"></h2><p class="lede" data-i="stockLede"></p></div>
      <div class="tabs" id="tabs"></div>
    </div>
    <div class="tools">
      <input class="search" id="q" type="search" autocomplete="off">
      <div class="sugg" id="sugg"></div>
    </div>
    <p class="ressum" id="resSum"></p>
    <div class="tablewrap"><table>
      <thead><tr id="thead"></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </section>

  <div class="two">
    <section class="panel" aria-labelledby="craftH">
      <div class="ph"><div><h2 id="craftH" data-i="craftH"></h2><p class="lede" data-i="craftLede"></p></div></div>
      <div class="recipes" id="recipes"></div>
    </section>

    <section class="panel" aria-labelledby="hdvH">
      <div class="ph"><div><h2 id="hdvH" data-i="hdvH"></h2><p class="lede" data-i="hdvLede"></p></div><span style="display:flex;gap:10px;align-items:center"><span class="mono" id="hdvCount"></span><button class="btn ghost" id="clearBtn" type="button"></button></span></div>
      <div class="slots" id="slots"></div>
      <div class="add">
        <select id="addItem"></select>
        <input id="addQty" type="text" inputmode="numeric">
        <input id="addPrice" type="text" inputmode="numeric">
        <button class="btn" id="addBtn" type="button" data-i="list"></button>
      </div>
      <h3 class="sub-h" data-i="buyH"></h3>
      <div class="add">
        <select id="buyItem"></select>
        <input id="buyQty" type="text" inputmode="numeric">
        <input id="buyPrice" type="text" inputmode="numeric">
        <button class="btn ghost" id="buyBtn" type="button" data-i="buy"></button>
      </div>
      <div class="toast" id="toast" aria-live="polite"></div>
      <div class="next"><h3 data-i="nextH"></h3><ol id="next"></ol></div>
      <div class="next"><h3 data-i="opsH"></h3><ol id="ops"></ol></div>
    </section>
  </div>

  <section class="panel" aria-labelledby="bkH">
    <div class="ph"><div><h2 id="bkH" data-i="bkH"></h2><p class="lede" data-i="bkLede"></p></div></div>
    <div class="backup">
      <button class="btn" id="bkCopy" type="button" data-i="bkCopy"></button>
      <textarea id="bkCode" spellcheck="false"></textarea>
      <button class="btn ghost" id="bkImport" type="button" data-i="bkImport"></button>
      <button class="btn ghost" id="bkReset" type="button" data-i="bkReset"></button>
    </div>
  </section>

  <footer>
    <nav>
      <a href="https://github.com/byjerkz/AION2-Market-Ledger" target="_blank" rel="noopener" data-i="fSrc"></a>
      <a href="https://github.com/byjerkz/AION2-Market-Ledger/issues" target="_blank" rel="noopener" data-i="fIssue"></a>

      <a href="https://github.com/byjerkz" target="_blank" rel="noopener">byjerkz</a>
    </nav>
    <span data-i="fNote"></span>
  </footer>
</div>

<script>
(function(){
'use strict';
const NET=0.88, SLOTS=10, KEY='aion2-market-ledger-v1', LKEY='aion2-market-ledger-lang';

/* ---------- textes FR / EN ---------- */
const TXT={
  sub:['Stock, prix du marché, crafts et HDV. Taxe comptée : 10 % à la vente + 2 % de frais d\'enregistrement.','Stock, market prices, crafting and listings. Fees counted: 10% sales tax + 2% listing fee.'],

  search:['Chercher ou ajouter un objet…','Search or add an item…'],
  craftH:['Calculateur de crafts','Crafting calculator'],
  craftLede:['Coût réel (ingrédients fabriqués par toi si c\'est moins cher), gain net, et bouton « Fabriquer » qui met ton stock à jour.','Real cost (self-crafted ingredients when cheaper), net profit, and a “Craft” button that updates your stock.'],
  hdvH:['File de l\'HDV','Market listings'],

  nextH:['Prochaines annonces conseillées','Suggested next listings'], opsH:['Dernières opérations','Recent operations'],
  bkH:['Sauvegarde et partage','Backup and sharing'],
  bkLede:['Tes données restent dans ce navigateur. Copie ton code pour changer de PC ou le garder en sécurité.','Your data stays in this browser. Copy your code to move to another PC or keep it safe.'],
  bkCopy:['Copier ma sauvegarde','Copy my backup'], bkImport:['Importer ce code','Import this code'], bkReset:['Tout effacer','Erase everything'],

/* ---------- signaux ---------- */
function signal(it){
  if(isPnj(it)) return {c:'s-bound',t:L('PNJ','NPC')};
  if(it.price==null) return {c:'s-na',t:L('Prix à saisir','Enter a price')};
  const base=it.ref, q=it.qty||0, R=it.reserve||0;
  if(R>0){
    if(q>R&&!(base&&it.price<=base*0.85)) return {c:'s-sell',t:L('Surplus ','Surplus ')+k(q-R)+L(' · vendre à ',' · sell at ')+k(it.price-1)};
    if(q<R&&base&&it.price<=base*0.6) return {c:'s-buy',t:L('Racheter · ','Buy back · ')+k(q)+'/'+k(R)};
    return {c:'s-keep',t:L('Réserve ','Reserve ')+k(Math.min(q,R))+'/'+k(R)};
  }
  if(q>0){
    if(base&&it.price<=base*0.85) return {c:'s-wait',t:L('Attendre · prix bas','Wait · low price')};
    return {c:'s-sell',t:L('Vendre à ','Sell at ')+k(it.price-1)};
  }
  if(!base) return {c:'s-track',t:L('Suivi','Tracking')};
  const r=it.price/base;
  if(r<=0.6) return {c:'s-buy',t:L('Racheter','Buy')};
  if(r<=0.85) return {c:'s-wait',t:L('Surveiller','Watch')};
  if(r<=1.1) return {c:'s-track',t:L('Prix normal','Normal price')};
  return {c:'s-high',t:L('Trop cher','Too expensive')};
}
function spark(h){
  if(!h||h.length<2) return '<span class="diff" style="color:var(--muted)">—</span>';
  const p=h.map(x=>x.p), mn=Math.min(...p), mx=Math.max(...p), W=84, H=24, n=p.length;
  const pts=p.map((v,i)=>[(i/(n-1))*(W-4)+2, mx===mn?H/2:H-3-((v-mn)/(mx-mn))*(H-6)]);
  const up=p[n-1]>=p[0], col=up?'var(--ok)':'var(--no)';

/* ---------- crafts ---------- */
function craftCalc(r,depth){
  depth=depth||0;
  let cost=0, miss=[], can=Infinity;
  const ing=r.inputs.map(([id,n])=>{let p=priceOf(id), made=false;
    const sub=depth<2&&RECIPES.find(x=>x.out===id);
    if(sub){const c=craftCalc(sub,depth+1);if(!c.miss.length&&c.cost>0){const u=c.cost/(sub.per||1);if(p==null||u<p){p=u;made=true;}}}
    if(p==null)miss.push(nm(id));else cost+=p*n;
    const it=items[id]; const lim=CAT[id]&&CAT[id].pnj?Infinity:Math.floor(((it&&it.qty)||0)/n);can=Math.min(can,lim);return {id,n,p,made};});
  const op=priceOf(r.out), sale=op!=null?op-1:null, net=sale!=null?sale*NET*(r.per||1):null;
  const gain=net!=null&&!miss.length?net-cost:null;
  return {ing,cost,miss,sale,net,gain,can:can===Infinity?null:can};
}

    const ing=c.ing.map(x=>'<span class="'+(x.p==null?'miss':'')+'">'+x.n+' × <b>'+esc(nm(x.id))+'</b> · '+(x.p==null?L('prix ?','price ?'):k(x.p))+(CAT[x.id]&&CAT[x.id].pnj?L(' (PNJ)',' (NPC)'):x.made?L(' (fabriqué)',' (crafted)'):'')+'</span>').join('');
    const g=c.gain;

      '<div class="ing">'+ing+'</div>'+

        (c.can!=null?L('Avec ton stock : ','With your stock: ')+'<b>'+c.can+'</b>'+(g!=null&&c.can>0?' → '+(g>0?'+':'')+short(g*c.can):''):''))+'</div>'+

  }).join('');

function op(r){return priceOf(r.out);}
function make(rid,box){
  const r=RECIPES.find(x=>x.id===rid); if(!r) return;
  const n=int(box.querySelector('[data-n]').value), f=Math.min(n,int(box.querySelector('[data-f]').value));
  if(n<1){flash(L('Indique le nombre de fabrications.','Enter how many crafts.'),true);return;}
  for(const [id,need] of r.inputs){const it=items[id];if(!(CAT[id]&&CAT[id].pnj)&&((it&&it.qty)||0)<need*n){flash(L('Pas assez de ','Not enough ')+nm(id)+' : '+((it&&it.qty)||0)+' / '+need*n,true);return;}}
  for(const [id,need] of r.inputs){if(items[id])items[id]=Object.assign({},items[id],{qty:Math.max(0,(items[id].qty||0)-need*n)});}
  const made=(n-f)*(r.per||1);
  if(!items[r.out]){items[r.out]={id:r.out,qty:0,price:null,ref:null,history:[]};S.order=Object.values(items).sort(byPos).map(x=>x.id);}
  items[r.out]=Object.assign({},items[r.out],{qty:(items[r.out].qty||0)+made});
  logOp('craft',r.out,made,0);commit();
  flash(made+' × '+nm(r.out)+L(' ajoutés',' added')+(f?' ('+f+L(' échec(s)',' fail(s)')+')':'')+'.');
}

function surplus(it){return Math.max(0,(it.qty||0)-(it.reserve||0));}
function lotFor(it){const p=it.price||0,q=surplus(it);return Math.max(1,Math.min(q,p>=200000?5:p>=30000?10:p>=3000?50:200));}
function left(at){
  const end=new Date(at).getTime()+72*36e5, ms=end-Date.now();
  if(isNaN(end)) return '';
  if(ms<=0) return '<span class="exp">'+L('expirée · à récupérer','expired · collect it')+'</span>';
  const h=Math.floor(ms/36e5);
  return h>=24?Math.floor(h/24)+L(' j ',' d ')+(h%24)+' h':h+' h '+Math.floor(ms%36e5/6e4)+' min';
}

  const v=all.reduce((a,it)=>a+(!isPnj(it)&&it.price!=null?(it.qty||0)*it.price*NET:0),0);
  $('tStock').textContent=short(v);
  const res=all.filter(it=>(it.reserve||0)>0), full=res.filter(it=>(it.qty||0)>=it.reserve).length;
  const miss=res.reduce((a,it)=>a+Math.max(0,it.reserve-(it.qty||0))*(it.price||0),0);
  $('resSum').innerHTML=res.length?L('Réserve banque : ','Bank reserve: ')+'<b>'+full+'/'+res.length+'</b>'+L(' objets complets · il manque ',' complete · missing ')+'<b>'+short(miss)+'</b>'+L(' au prix du marché.',' at market price.'):'';
  const h=slots.reduce((a,s)=>a+s.qty*s.price*0.9,0);
  if(document.activeElement!==$('tKin')) $('tKin').value=wallet.kinah!=null?k(wallet.kinah):'';
  $('tKinSub').textContent=wallet.kinah!=null?L('patrimoine ','net worth ')+short(wallet.kinah+v+h):L('saisis ton solde','enter your balance');
}
function applyLang(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-i]').forEach(el=>{el.textContent=t(el.dataset.i);});
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===LANG)));
  $('q').placeholder=t('search'); $('q').setAttribute('aria-label',t('search'));
  $('addQty').placeholder=L('Qté','Qty'); $('addPrice').placeholder=L('Prix unité','Unit price');
  $('buyQty').placeholder=L('Qté','Qty'); $('buyPrice').placeholder=L('Prix unité','Unit price');
  $('bkCode').placeholder=L('Colle ici un code de sauvegarde (AION2ML:…)','Paste a backup code here (AION2ML:…)');
  $('clearBtn').title=L('Retire toutes les annonces et remet les objets en stock','Cancels every listing and returns the items to stock');
  renderHead(); renderAll();
}
function renderAll(){renderTabs();renderRows();renderRecipes();renderSlots();renderTiles();renderBuy();renderOps();if(histId)renderHist();
  if(!saveOK) flash(L('Ton navigateur bloque la sauvegarde locale : pense à copier ta sauvegarde.','Your browser blocks local storage: remember to copy your backup.'),true);}

/* ---------- événements ---------- */
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{LANG=b.dataset.lang;try{localStorage.setItem(LKEY,LANG);}catch(_){}applyLang();}));
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;tab=b.dataset.t;renderTabs();renderRows();});
$('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();renderRows();renderSugg();});
$('q').addEventListener('focus',renderSugg);
$('q').addEventListener('keydown',e=>{if(e.key==='Escape'){e.target.value='';query='';renderRows();renderSugg();}if(e.key==='Enter'){const b=$('sugg').querySelector('button');if(b)b.click();}});
$('sugg').addEventListener('mousedown',e=>e.preventDefault());
$('sugg').addEventListener('click',e=>{const b=e.target.closest('[data-add]');if(b){addItem(b.dataset.add);return;}if(e.target.closest('[data-addc]')){const name=$('q').value.trim();addItem('perso-'+Date.now().toString(36),name);}});
document.addEventListener('click',e=>{if(!e.target.closest('.tools'))$('sugg').style.display='none';});
// cellules : validation explicite
function commitCell(c){c.dataset.commit='1';saveField(c.closest('tr').dataset.id,c.dataset.f,c.value);}
$('rows').addEventListener('input',e=>{const c=e.target;if(!c.classList.contains('cell'))return;const ch=c.value!==c.defaultValue;c.classList.toggle('dirty',ch);let b=c.parentNode.querySelector('.okc');
  if(ch&&!b){b=document.createElement('button');b.type='button';b.className='okc';b.textContent='✓';b.title=L('Valider','Confirm');c.parentNode.appendChild(b);}else if(!ch&&b)b.remove();});
$('rows').addEventListener('mousedown',e=>{if(e.target.classList.contains('okc'))e.preventDefault();});
$('rows').addEventListener('keydown',e=>{const c=e.target;if(!c.classList.contains('cell'))return;if(e.key==='Enter'){commitCell(c);c.blur();}else if(e.key==='Escape'){c.value=c.defaultValue;c.blur();}});
$('rows').addEventListener('focusout',e=>{const c=e.target;if(!c.classList.contains('cell'))return;if(c.dataset.commit){delete c.dataset.commit;return;}c.value=c.defaultValue;c.classList.remove('dirty');const b=c.parentNode.querySelector('.okc');if(b)b.remove();});
$('rows').addEventListener('click',e=>{
  if(e.target.classList.contains('okc')){const c=e.target.parentNode.querySelector('.cell');commitCell(c);c.blur();return;}
  const rm=e.target.closest('[data-rm]');
  if(rm){const id=rm.closest('tr').dataset.id;if(rmArm===id){rmArm=null;removeItem(id);}else{rmArm=id;rm.classList.add('arm');rm.textContent=L('Sûr ?','Sure?');setTimeout(()=>{if(rmArm===id){rmArm=null;renderRows();}},3000);}return;}
  const td=e.target.closest('[data-hist]');
  if(td){histId=td.dataset.hist;renderHist();const r=td.getBoundingClientRect(),box=$('hist');box.style.display='block';
    box.style.left=Math.max(8,Math.min(innerWidth-296,r.left))+'px';box.style.top=(r.bottom+6+box.offsetHeight>innerHeight?Math.max(8,r.top-box.offsetHeight-6):r.bottom+6)+'px';}
});
$('hist').addEventListener('click',e=>{if(e.target.closest('[data-hx]')){histId=null;$('hist').style.display='none';return;}const d=e.target.closest('[data-hdel]');if(d)delHist(+d.dataset.hdel);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&histId){histId=null;$('hist').style.display='none';}});
// glisser-déposer
$('rows').addEventListener('pointerdown',e=>{const h=e.target.closest('.grip');if(!h)return;e.preventDefault();const tr=h.closest('tr');drag={tr};tr.classList.add('drag');try{h.setPointerCapture(e.pointerId);}catch(_){}});
$('rows').addEventListener('pointermove',e=>{if(!drag)return;let before=null;for(const r of $('rows').children){if(r===drag.tr)continue;const b=r.getBoundingClientRect();if(e.clientY<b.top+b.height/2){before=r;break;}}if(before)$('rows').insertBefore(drag.tr,before);else $('rows').appendChild(drag.tr);});
function drop(){const tr=drag.tr;drag=null;tr.classList.remove('drag');
  const nv=[...$('rows').children].map(r=>r.dataset.id).filter(Boolean), all=Object.values(items).sort(byPos).map(x=>x.id);
  const idx=all.map((id,i)=>nv.includes(id)?i:-1).filter(i=>i>=0); idx.forEach((i,n)=>{all[i]=nv[n];});
  S.order=all; commit();}
$('rows').addEventListener('pointerup',()=>{if(drag)drop();});
$('rows').addEventListener('pointercancel',()=>{if(drag)drop();});
// crafts / HDV / achats
$('recipes').addEventListener('click',e=>{const b=e.target.closest('[data-mk]');if(b)make(b.dataset.mk,b.closest('.mk'));});
$('addBtn').addEventListener('click',addSlot);
$('addItem').addEventListener('change',()=>{const it=items[$('addItem').value];if(it){$('addQty').value='';$('addQty').placeholder='max '+(it.qty||0);$('addPrice').value=it.price!=null?it.price-1:'';$('addQty').focus();}});
$('slots').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)slotAction(+b.closest('.slot').dataset.i,b.dataset.a);});
$('buyBtn').addEventListener('click',buy);
$('buyItem').addEventListener('change',()=>{const p=priceOf($('buyItem').value);if(p!=null)$('buyPrice').value=p;});
$('clearBtn').addEventListener('click',()=>{
  const b=$('clearBtn'); if(!slots.length) return;
  if(!clearArm){b.textContent=L('Confirmer ?','Confirm?');b.style.color='var(--no)';b.style.borderColor='var(--no)';clearArm=setTimeout(()=>{clearArm=null;b.style.color='';b.style.borderColor='';renderSlots();},3000);return;}
  clearTimeout(clearArm);clearArm=null;b.style.color='';b.style.borderColor='';
  slots.forEach(s=>{if(items[s.item])items[s.item]=Object.assign({},items[s.item],{qty:(items[s.item].qty||0)+s.qty});});
  slots=[];commit();flash(L('File vidée, objets remis en stock.','Listings cleared, items back in stock.'));
});
$('tKin').addEventListener('keydown',e=>{if(e.key==='Enter')e.target.blur();if(e.key==='Escape'){e.target.value=wallet.kinah!=null?k(wallet.kinah):'';e.target.blur();}});
$('tKin').addEventListener('change',e=>{const n=num(e.target.value);if(n==null||n<0){renderTiles();return;}wallet=Object.assign({},wallet,{kinah:n});commit();flash(L('Solde enregistré.','Balance saved.'));});
// sauvegarde
$('bkCopy').addEventListener('click',async()=>{
  const code='AION2ML:'+btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  $('bkCode').value=code;$('bkCode').select();
  try{await navigator.clipboard.writeText(code);flash(L('Code copié dans le presse-papier.','Code copied to clipboard.'));}catch(_){flash(L('Code affiché : copie-le avec Ctrl+C.','Code shown: copy it with Ctrl+C.'));}
});
$('bkImport').addEventListener('click',()=>{
  const v=$('bkCode').value.trim();
  try{if(!v.startsWith('AION2ML:'))throw 0;const d=JSON.parse(decodeURIComponent(escape(atob(v.slice(8)))));if(!d||typeof d.items!=='object')throw 0;
    S=Object.assign(blank(),d);items=S.items;slots=S.slots;wallet=S.wallet;journal=S.journal;persist();renderAll();flash(L('Sauvegarde importée.','Backup imported.'));}
  catch(_){flash(L('Code invalide.','Invalid code.'),true);}
});
let resetArm=null;
$('bkReset').addEventListener('click',()=>{
  const b=$('bkReset');
  if(!resetArm){b.textContent=L('Vraiment tout effacer ?','Really erase everything?');b.style.color='var(--no)';resetArm=setTimeout(()=>{resetArm=null;b.textContent=t('bkReset');b.style.color='';},3000);return;}
  clearTimeout(resetArm);resetArm=null;b.textContent=t('bkReset');b.style.color='';
  S=blank();items=S.items;slots=S.slots;wallet=S.wallet;journal=S.journal;persist();renderAll();flash(L('Tout est effacé.','Everything erased.'));
});

applyLang();
setInterval(renderSlots,60000);
})();
</script>
</body>
</html>
